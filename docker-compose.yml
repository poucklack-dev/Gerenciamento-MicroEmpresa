services:
  web:
    build: .
    container_name: patagonia_web
    # Monta o código-fonte e os uploads para desenvolvimento local.
    volumes:
      - ./:/app
      - ./uploads:/tmp/uploads
    ports:
      - "8080:8080"
    environment:
      ENV: development
      LOCAL_STORAGE_PATH: /tmp/uploads
      SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY no arquivo .env}
      ENABLE_DEBUG_ROUTES: "0"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-patagonia}
      DB_USER: ${DB_USER:-patagonia}
      DB_PASS: ${DB_PASS:?Defina DB_PASS no arquivo .env}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:15-alpine
    container_name: patagonia_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./schema_patagonia.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    environment:
      POSTGRES_DB: ${DB_NAME:-patagonia}
      POSTGRES_USER: ${DB_USER:-patagonia}
      POSTGRES_PASSWORD: ${DB_PASS:?Defina DB_PASS no arquivo .env}
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$${POSTGRES_PASSWORD} psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -c 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    name: patagonia_portfolio_data
