{% extends "base.html" %}{% block title %}Empresa · Aurora Gestão{% endblock %}{% block conteudo %}
<section class="erp-page-header"><div><h1>Empresa</h1><p>Identidade e dados administrativos do negócio</p></div></section>
<form id="companyForm" class="company-card"><fieldset><legend>Dados gerais</legend><div class="company-grid"><label>Nome fantasia <input name="nome_fantasia" required maxlength="120"></label><label>Razão social <input name="razao_social" maxlength="160"></label><label>CPF/CNPJ <input name="cpf_cnpj" maxlength="18"></label><label>Segmento <select name="segmento"><option>Serviços</option><option>Comércio</option><option>Consultoria</option><option>Engenharia</option><option>Administrativo</option><option>Outros</option></select></label><label>Responsável <input name="responsavel" maxlength="120"></label><label>Cor institucional <input type="color" name="cor_institucional" value="#167052"></label></div></fieldset><fieldset><legend>Contato e endereço</legend><div class="company-grid"><label>Telefone <input name="telefone" maxlength="24"></label><label>E-mail <input type="email" name="email" maxlength="160"></label><label class="wide">Endereço <input name="endereco" maxlength="200"></label><label>Cidade <input name="cidade" maxlength="100"></label><label>Estado <input name="estado" maxlength="2"></label><label>CEP <input name="cep" maxlength="10"></label></div></fieldset><div class="form-actions"><span id="companyMessage" role="status"></span><button class="btn-primary-erp" type="submit">Salvar alterações</button></div></form>
<style>.company-card{max-width:900px;background:#fff;border:1px solid var(--border);border-radius:var(--radius-md);padding:18px}.company-card fieldset{border:0;padding:0;margin:0 0 20px}.company-card legend{font-size:14px;font-weight:700;padding-bottom:10px;border-bottom:1px solid var(--border);width:100%;margin-bottom:12px}.company-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px 16px}.company-grid label{display:flex;flex-direction:column}.company-grid .wide{grid-column:1/-1}.form-actions{display:flex;justify-content:flex-end;align-items:center;gap:14px;padding-top:14px;border-top:1px solid var(--border)}#companyMessage{font-size:11px;color:var(--success)}@media(max-width:650px){.company-grid{grid-template-columns:1fr}.company-grid .wide{grid-column:auto}}</style>
{% endblock %}{% block scripts %}<script>const form=document.getElementById('companyForm'),msg=document.getElementById('companyMessage');fetch('/api/empresa').then(r=>r.json()).then(data=>Object.entries(data).forEach(([k,v])=>{if(form.elements[k])form.elements[k].value=v||''})).catch(()=>msg.textContent='Não foi possível carregar os dados.');form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='Salvando...';const data=Object.fromEntries(new FormData(form));const r=await fetch('/api/empresa',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),body=await r.json();msg.textContent=body.message||body.error||'Não foi possível salvar.'});</script>{% endblock %}
